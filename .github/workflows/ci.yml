name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Lua
        run: sudo apt-get update && sudo apt-get install -y lua5.4

      - name: Lua syntax
        run: |
          for f in hammerspoon/init.lua hammerspoon/foxbot/*.lua tests/*.lua; do
            luac5.4 -p "$f" && echo "ok   $f"
          done

      - name: Unit tests
        run: lua5.4 tests/run.lua

      - name: Shell syntax
        run: |
          bash -n install.sh
          bash -n uninstall.sh
          bash -n hooks/foxbot.sh
          bash -n tests/hook.sh

      - name: Hook integration tests
        run: ./tests/hook.sh

      - name: Python syntax
        run: |
          python3 -m py_compile bin/foxbot tools/draw_fox.py tools/import_sprite.py tools/slice_sheet.py
          # The hook's logic lives in a heredoc; compile it on its own.
          sed -n '/^FOXBOT_KIND=.*<<.PY.$/,/^PY$/p' hooks/foxbot.sh | sed '1d;$d' > /tmp/hook.py
          python3 -m py_compile /tmp/hook.py

      - name: The sprite still draws
        run: |
          python3 -m pip install --quiet pillow
          python3 tools/draw_fox.py --out /tmp/fox.png

      - name: Only one file talks to the network
        run: |
          # Everything except remote.lua stays offline. remote.lua is the single
          # opt-in feature that leaves the machine, and confining it to one file
          # is what keeps that claim checkable rather than aspirational.
          if grep -rn "hs.http\|urlevent\|curl \|wget \|socket\." \
               --exclude=remote.lua hammerspoon/ hooks/; then
            echo "::error::a network call appeared outside remote.lua"
            exit 1
          fi
          echo "ok: nothing outside remote.lua talks to the network"

      - name: And it cannot run without a key you put there
        run: |
          # The guarantee is not "there is a switch somewhere" -- it is that
          # every path into the network checks for the key file first. If a new
          # request is added without that check, this fails.
          calls=$(grep -c "hs.http.async" hammerspoon/foxbot/remote.lua)
          guards=$(grep -c "Remote.key()" hammerspoon/foxbot/remote.lua)
          echo "$calls network calls, $guards key checks"
          if [ "$guards" -lt "$calls" ]; then
            echo "::error::a request in remote.lua is not behind a key check"
            exit 1
          fi
          if ! grep -q "fresh" hammerspoon/foxbot/settings.lua; then
            echo "::error::the opt-in switch has gone missing"
            exit 1
          fi
          if grep -qE "fresh +=  *true" hammerspoon/foxbot/settings.lua; then
            echo "::error::the network feature must default to off"
            exit 1
          fi
          echo "ok: gated on a key file and an off-by-default switch"

      - name: No key is committed
        run: |
          if grep -rnE "gsk_[A-Za-z0-9]{20,}|sk-[A-Za-z0-9]{20,}" \
               --exclude-dir=.git .; then
            echo "::error::that looks like an API key"
            exit 1
          fi
          echo "ok: no keys in the tree"

      - name: The AppleScript bridge stays off
        run: |
          if grep -rn "^[^-]*hs.allowAppleScript(true)" hammerspoon/ install.sh; then
            echo "::error::the AppleScript bridge must never be on by default"
            exit 1
          fi
          echo "ok: bridge is off"
